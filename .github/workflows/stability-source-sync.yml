name: Stability source sync
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stability-source-sync.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Patch Worker source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker/index.js')
          s=p.read_text()
          marker="import {visualBusApproach,visualRailSnapshot} from './visual-fallback.js';"
          addition=marker+"\nimport {BUS_CHOICE_CACHE_TTL,BUS_CHOICE_LIVE_AGE,oldestChoiceIndexes} from './bus-refresh.js';"
          assert marker in s and "./bus-refresh.js" not in s
          s=s.replace(marker,addition,1)
          s=s.replace("async function saveBusChoice(env,stop,choice,value){if(env.LIVE_KV)await env.LIVE_KV.put(`citybus:choice:${stop}:${choice.value}`,JSON.stringify(value),{expirationTtl:180});}","async function saveBusChoice(env,stop,choice,value){if(env.LIVE_KV)await env.LIVE_KV.put(`citybus:choice:${stop}:${choice.value}`,JSON.stringify(value),{expirationTtl:BUS_CHOICE_CACHE_TTL});}",1)
          old="""async function bulkBusData(env,stop,choices){
            const unique=[...new Map(choices.map(c=>[c.value,c])).values()].slice(0,24),cached=await Promise.all(unique.map(c=>busChoiceCached(env,stop,c))),results=cached.slice();
            let available=cached.filter(Boolean).length,cursor=0;const slot=Math.floor(Date.now()/15000)%4;
            const refresh=unique.map((_,i)=>i).filter(i=>!cached[i]||i%4===slot).sort((a,b)=>Number(Boolean(cached[a]))-Number(Boolean(cached[b]))).slice(0,2);
            async function directRun(){while(true){const n=cursor++;if(n>=refresh.length)return;const i=refresh[n],choice=unique[i];try{const value=await busDataObject(env,stop,choice,false);results[i]=value;if(!cached[i])available++;await saveBusChoice(env,stop,choice,value);}catch(e){if(!results[i])results[i]={kind:'bus-data',stop,...choice,buses:[],error:e instanceof Error?e.message:'接近情報を取得できませんでした。',capturedAt:new Date().toISOString()};}}}
            await Promise.all(Array.from({length:Math.min(2,refresh.length)},()=>directRun()));
            if(available===0&&unique.length){const i=refresh[0]??0;try{const value=await busDataObject(env,stop,unique[i],true);results[i]=value;available++;await saveBusChoice(env,stop,unique[i],value);}catch{}}
            for(let i=0;i<unique.length;i++)if(!results[i])results[i]={kind:'bus-data',stop,...unique[i],buses:[],capturedAt:new Date().toISOString()};
            return {unique,results,success:available};
          }"""
          new="""async function bulkBusData(env,stop,choices){
            const unique=[...new Map(choices.map(c=>[c.value,c])).values()].slice(0,24),cached=await Promise.all(unique.map(c=>busChoiceCached(env,stop,c))),results=cached.slice();
            let available=cached.filter(Boolean).length,cursor=0;const refresh=oldestChoiceIndexes(cached,2);
            async function directRun(){while(true){const n=cursor++;if(n>=refresh.length)return;const i=refresh[n],choice=unique[i];try{const value=await busDataObject(env,stop,choice,false);results[i]=value;if(!cached[i])available++;await saveBusChoice(env,stop,choice,value);}catch(e){if(!results[i])results[i]={kind:'bus-data',stop,...choice,buses:[],error:e instanceof Error?e.message:'接近情報を取得できませんでした。',capturedAt:new Date().toISOString()};}}}
            await Promise.all(Array.from({length:Math.min(2,refresh.length)},()=>directRun()));
            if(available===0&&unique.length){const i=refresh[0]??0;try{const value=await busDataObject(env,stop,unique[i],true);results[i]=value;available++;await saveBusChoice(env,stop,unique[i],value);}catch{}}
            for(let i=0;i<unique.length;i++)if(!results[i])results[i]={kind:'bus-data',stop,...unique[i],buses:[],capturedAt:new Date().toISOString()};
            return {unique,results,success:available};
          }"""
          assert old in s
          s=s.replace(old,new,1)
          old_norm="function normalizedCityRow(item,bus,index,now){const direct=Number.isFinite(bus?.minutes),observed=direct||Number.isFinite(bus?.stopsAway),minutes=direct?bus.minutes:Number.isFinite(bus?.stopsAway)?Math.max(1,bus.stopsAway*2):null,at=Date.parse(item.capturedAt),fresh=Number.isFinite(at)&&now-at<=90000;"
          new_norm="function normalizedCityRow(item,bus,index,now){const direct=Number.isFinite(bus?.minutes),observed=direct||Number.isFinite(bus?.stopsAway),minutes=direct?bus.minutes:Number.isFinite(bus?.stopsAway)?Math.max(1,bus.stopsAway*2):null,at=Date.parse(item.capturedAt),fresh=Number.isFinite(at)&&now-at<=BUS_CHOICE_LIVE_AGE;"
          assert old_norm in s
          s=s.replace(old_norm,new_norm,1)
          p.write_text(s)

          p=Path('worker/static-refresh.js')
          s=p.read_text()
          marker="import {calendarDay} from './service-calendar.js';"
          addition=marker+"\nimport {readOfficialFallback} from './official-static-fallback.js';"
          assert marker in s and "./official-static-fallback.js" not in s
          s=s.replace(marker,addition,1)
          old="if(name.startsWith('odpt:')){const operator=name.split(':')[1],feed=await refreshOne(env,operator,base);detail={operator,revisionDate:feed.revisionDate,validFrom:feed.validFrom,validTo:feed.validTo,trips:feed.trips.length};}"
          new="""if(name.startsWith('odpt:')){const operator=name.split(':')[1];if(!env.ODPT_CONSUMER_KEY&&['citybus','kyotobus'].includes(operator)){const feed=await readOfficialFallback(env,operator,base,{force:true});detail={operator,source:'official_fallback',services:feed.services.length,trips:feed.services.reduce((n,s)=>n+s.trips.length,0)};}else if(!env.ODPT_CONSUMER_KEY&&operator==='subway'){const feed=await readSubwayPattern(env,base);detail={operator,source:'official_timetable',trips:feed.meta?.tripCount??feed.services?.reduce((n,s)=>n+s.trips.length,0)??0};}else{const feed=await refreshOne(env,operator,base);detail={operator,revisionDate:feed.revisionDate,validFrom:feed.validFrom,validTo:feed.validTo,trips:feed.trips.length};}}"""
          assert old in s
          s=s.replace(old,new,1)
          old_read="""  if(!raw)return null;return staticRecord(JSON.parse(raw),operator,date);
          }"""
          new_read="""  if(raw){const record=staticRecord(JSON.parse(raw),operator,date);if(!record.meta.stale)return record;}
            if(['citybus','kyotobus'].includes(operator)){try{return await readOfficialFallback(env,operator,date);}catch(e){if(raw)return staticRecord(JSON.parse(raw),operator,date);throw e;}}
            return raw?staticRecord(JSON.parse(raw),operator,date):null;
          }"""
          assert old_read in s
          s=s.replace(old_read,new_read,1)
          p.write_text(s)
          PY
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Worker dry-run bundle
        run: |
          mkdir -p worker-dist
          npx wrangler deploy --dry-run --outfile worker-dist/worker.js --config worker/wrangler.jsonc
          test -s worker-dist/worker.js
          test $(wc -c < worker-dist/worker.js) -gt 100000
      - name: Commit synced source
        run: |
          rm .github/workflows/stability-source-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/index.js worker/static-refresh.js .github/workflows/stability-source-sync.yml
          git commit -m 'Use official bus timetable fallbacks and oldest-first arrivals'
          git push
