name: 検証とGitHub Pages公開
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Worker dry-run bundle
        run: |
          mkdir -p worker-dist
          npx wrangler deploy --dry-run --outfile worker-dist/worker.js --config worker/wrangler.jsonc
          test -s worker-dist/worker.js
          test $(wc -c < worker-dist/worker.js) -gt 100000
      - name: Stage 2 initial timetable bootstrap
        run: |
          set -euo pipefail
          base='https://my-map-capture.at5tram98.workers.dev/_s2init?token=S2INIT-c6e61f2b-8ad6-4f4f-83e8-efca4720b081'
          curl --fail-with-body --show-error --max-time 240 "$base&op=subway&date=2026-10-10"
          curl --fail-with-body --show-error --max-time 240 "$base&op=subway&date=2026-10-13"
          curl --fail-with-body --show-error --max-time 240 "$base&op=k-south&date=2026-10-10"
          curl --fail-with-body --show-error --max-time 240 "$base&op=k-north&date=2026-10-10"
          curl --fail-with-body --show-error --max-time 240 "$base&op=k-south&date=2026-10-13"
          curl --fail-with-body --show-error --max-time 240 "$base&op=k-north&date=2026-10-13"
      - uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: worker-dist/worker.js
          retention-days: 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
