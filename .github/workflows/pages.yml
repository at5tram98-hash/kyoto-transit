name: 検証とGitHub Pages公開
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Unit tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics
          path: test-output.log
          if-no-files-found: error
          retention-days: 1
      - run: npm run build
      - name: Record release version
        id: release
        run: node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; const version=readFileSync("dist/sw.js","utf8").match(/const VERSION = "([a-f0-9]{12})"/)[1]; appendFileSync(process.env.GITHUB_OUTPUT,`version=${version}\n`);'
      - name: Install browsers for UI regression checks
        run: npx playwright install --with-deps chromium webkit
      - name: Check responsive UI and journeys in WebKit
        run: |
          npm run test:browser
          npm run test:pwa
        env:
          BROWSER_ENGINE: webkit
          BROWSER_ARTIFACT_DIR: browser-artifacts/webkit
      - name: Check responsive UI and journeys in Chromium
        run: |
          npm run test:browser
          npm run test:pwa
        env:
          BROWSER_ARTIFACT_DIR: browser-artifacts/chromium
      - name: Check real geographical basemap
        run: npm run test:browser
        env:
          BROWSER_SPEC_ONLY: '1'
          VERIFY_LIVE_MAP: '1'
          BROWSER_ARTIFACT_DIR: browser-artifacts/real-map
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Worker dry-run bundle
        run: |
          mkdir -p worker-dist
          npx wrangler deploy --dry-run --outfile worker-dist/worker.js --config worker/wrangler.jsonc
          test -s worker-dist/worker.js
          test $(wc -c < worker-dist/worker.js) -gt 100000
      - uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: worker-dist/worker.js
          retention-days: 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
  verify-production:
    name: 公開済みサイト・実運行APIの接続確認
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify published release and transport providers
        run: npm run verify:production
        env:
          APP_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_BUILD_VERSION: ${{ needs.build.outputs.version }}
          PRODUCTION_REPORT_DIR: production-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: production-artifacts/
          if-no-files-found: error
          retention-days: 7