name: Stage 2 subway bootstrap
on:
  push:
    paths:
      - .github/workflows/stage2-subway-bootstrap.yml
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Subway weekend
        run: curl --fail --show-error --silent --max-time 90 -H 'Origin: https://at5tram98-hash.github.io' 'https://my-map-capture.at5tram98.workers.dev/_stage2-refresh?op=subway&date=2026-10-10'
      - name: Subway weekday
        run: curl --fail --show-error --silent --max-time 90 -H 'Origin: https://at5tram98-hash.github.io' 'https://my-map-capture.at5tram98.workers.dev/_stage2-refresh?op=subway&date=2026-10-09'
