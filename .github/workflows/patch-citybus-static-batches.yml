name: Patch City Bus static refresh batches
on:
  push:
    branches: [main]
    paths:
      - scripts/patch-citybus-static-batches.py
      - .github/workflows/patch-citybus-static-batches.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/patch-citybus-static-batches.py
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Worker dry-run bundle
        run: |
          mkdir -p worker-dist
          npx wrangler deploy --dry-run --outfile worker-dist/worker.js --config worker/wrangler.jsonc
          test -s worker-dist/worker.js
      - name: Commit verified static refresh split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch-citybus-static-batches.py .github/workflows/patch-citybus-static-batches.yml
          git add worker/official-static-fallback.js worker/static-refresh.js tests/official-static-fallback.test.js tests/static-refresh-plan.test.js
          git commit -m "Split City Bus static fallback refresh into safe batches"
          git push
