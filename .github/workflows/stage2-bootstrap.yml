name: Stage 2 one-time timetable bootstrap
on:
  push:
    paths:
      - .github/workflows/stage2-bootstrap.yml
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Subway single timetable
        run: |
          curl --show-error --silent --max-time 60 -w '\nHTTP %{http_code}\n' 'https://my-map-capture.at5tram98.workers.dev/timetable?stop=K07&direction=north&day=holiday&date=2026-10-10'
      - name: Kintetsu single timetable
        run: |
          curl --show-error --silent --max-time 60 -w '\nHTTP %{http_code}\n' 'https://my-map-capture.at5tram98.workers.dev/timetable?stop=B01&direction=south&day=holiday&date=2026-10-10'
