name: Diagnose city build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-city-build.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Inspect city fallback generation
        run: |
          node --input-type=module <<'NODE'
          import catalog from './public/data/bus-catalog.json' with {type:'json'};
          import {createNetwork,normalize} from './public/js/network.js';
          import {calendarDay} from './worker/service-calendar.js';
          import {officialText,parseCityCatalog,parseHyperdia} from './worker/timetables.js';
          const network=createNetwork(catalog), date='2026-10-11', day=calendarDay(date,'citybus');
          const clean=s=>s?.fullName??s?.name??'';
          for (const service of network.services.filter(s=>s.operator==='citybus'&&s.prototype)) {
            const route=String(service.route??''); if(!['202','204','205','206','208'].includes(route)) continue;
            console.log('\nSERVICE', service.id, 'route',route,'stops',service.stops.length,'offsets',service.offsets.length,'first2',service.stops.slice(0,2).map(id=>network.stops.get(id)?.name),'last2',service.stops.slice(-2).map(id=>network.stops.get(id)?.name));
            try {
              const source=catalog[route].source;
              const rows=parseCityCatalog(await officialText(source,fetch,0),source);
              const anchor=network.stops.get(service.stops[0]), next=network.stops.get(service.stops[1]);
              const row=rows.find(r=>normalize(r.name)===normalize(clean(anchor)));
              console.log('anchor',clean(anchor),'next',clean(next),'row?',!!row,'boards',row?.boards?.map(b=>b.label));
              const target=normalize(clean(next));
              const scored=(row?.boards??[]).map((board,index)=>({board,index,score:target&&normalize(board.label??'').includes(target)?10:0})).sort((a,b)=>b.score-a.score||((service.id.endsWith('-up')?b.index:a.index)-(service.id.endsWith('-up')?a.index:b.index)));
              const board=scored[0]?.board; console.log('chosen',board?.label,board?.sourceURL);
              const parsed=parseHyperdia(await officialText(board.sourceURL,fetch,0)); const entries=parsed.days?.[day]??[];
              console.log('day',day,'entries',entries.length,'first',entries[0]?.depart,'offset0',service.offsets[0],'offsetLast',service.offsets.at(-1));
              const bad=[];
              for (const e of entries.slice(0,3)) {
                const times=service.offsets.map(o=>Math.round(e.depart+(o-service.offsets[0])));
                for(let i=1;i<times.length;i++) if(times[i]<times[i-1]) bad.push([i,times[i-1],times[i]]);
              }
              console.log('monotonic?',!bad.length,'bad',bad.slice(0,5));
            } catch(e) {console.log('ERROR',e.stack||e.message);}
          }
          NODE
      - name: Remove diagnostic workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-city-build.yml
          git commit -m 'Remove circular city fallback diagnostic workflow'
          git push
