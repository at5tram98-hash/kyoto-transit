name: 1A align audio window
on:
  push:
    branches: [chatgpt/1a-final]
permissions:
  contents: write
jobs:
  patch:
    if: "!startsWith(github.event.head_commit.message, 'fix: align audio evidence freshness window')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Align detector freshness with 60s microphone / 75s audio evidence TTL
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/js/vnext-detect.js')
          text = path.read_text()
          old_announcement = 'announcement && Date.now() - announcement.at <= 45000'
          old_progress = 'Date.now() - audio.at <= 45000'
          assert text.count(old_announcement) == 1, text.count(old_announcement)
          assert text.count(old_progress) == 1, text.count(old_progress)
          text = text.replace(old_announcement, 'announcement && Date.now() - announcement.at <= 75000')
          text = text.replace(old_progress, 'Date.now() - audio.at <= 75000')
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/js/vnext-detect.js
          git commit -m 'fix: align audio evidence freshness window'
          git push origin HEAD:chatgpt/1a-final
