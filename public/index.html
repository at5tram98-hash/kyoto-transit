<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="description" content="京都の地下鉄・近鉄・バスを、現在地と公式運行情報から自動で案内する My Map。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Map">
  <meta name="color-scheme" content="light dark">
  <title>My Map</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="vnext.css">
  <link rel="stylesheet" href="vnext-ui.css">
  <link rel="stylesheet" href="vnext-sheets.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-copy">
        <p class="eyebrow" id="view-subtitle">現在地に合わせて自動案内</p>
        <h1 id="view-title">今</h1>
      </div>
      <button class="location-pill" id="location-indicator" type="button" aria-label="位置情報を確認">位置情報</button>
    </header>

    <main>
      <section class="view" data-view="now" aria-label="今">
        <div id="now-hero" aria-live="polite"></div>
        <div id="vehicle-panel"></div>
        <div id="network-panel"></div>
        <div id="nearby-panel"></div>
      </section>
      <section class="view" data-view="timetable" aria-label="時刻表" hidden>
        <div id="timetable-root"></div>
      </section>
      <section class="view" data-view="operations" aria-label="運行情報" hidden>
        <div id="operations-root" aria-live="polite"></div>
      </section>
      <section class="view" data-view="settings" aria-label="設定" hidden>
        <div id="settings-content"></div>
      </section>
    </main>

    <nav class="tabbar" aria-label="メインナビゲーション"></nav>
  </div>

  <dialog class="sheet" id="foldback-sheet">
    <div class="sheet-header">
      <h2>折り返し乗車</h2>
      <button class="sheet-close" type="button" data-sheet-close aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="foldback-body"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/vnext.js"></script>
</body>
</html>
